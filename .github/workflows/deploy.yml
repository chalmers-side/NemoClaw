name: Deploy NemoClaw

on:
  push:
    branches:
      - main
      - 'feature**'
  workflow_dispatch:
    inputs:
      target:
        description: Machine to deploy (personal_config directory name)
        required: true
        type: choice
        options:
          - poc
          - chalmers
          - cliff
      action:
        description: onboard installs or recreates the sandbox; upgrade updates the pinned NemoClaw install
        required: true
        type: choice
        default: onboard
        options:
          - onboard
          - upgrade

concurrency:
  # Push events have no inputs; those deploys go to poc.
  group: nemoclaw-${{ inputs.target || 'poc' }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy ${{ inputs.target || 'poc' }}
    # Push to main or feature* deploys poc. A manual run still picks the target.
    # poc runs on the macOS ARM64 self-hosted runner. Other targets stay on nemoclaw,<user>.
    runs-on: ${{ fromJSON((inputs.target || 'poc') == 'poc' && '["self-hosted", "macOS", "ARM64"]' || format('["self-hosted", "nemoclaw", "{0}"]', inputs.target || 'poc')) }}
    environment: ${{ inputs.target || 'poc' }}
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy
        run: bash ./scripts/deploy.sh "$TARGET" "$ACTION"
        env:
          TARGET: ${{ inputs.target || 'poc' }}
          ACTION: ${{ inputs.action || 'onboard' }}
