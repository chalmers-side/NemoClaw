name: Deploy NemoClaw

# Same path as main's workflow so the Actions button exists.
# auto = daily sync + host-file rebuild + health checks (never onboard).
# sandbox = first install only; refuses if the sandbox already exists.
# ollama / nemoclaw force one host stage.
on:
  workflow_dispatch:
    inputs:
      target:
        description: Machine (personal_config directory name)
        required: true
        type: choice
        options:
          - poc
          - chalmers
          - cliff
      stage:
        description: auto from diff, or force one stage
        required: true
        type: choice
        options:
          - auto
          - ollama
          - nemoclaw
          - sandbox

concurrency:
  group: nemoclaw-${{ inputs.target }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: ${{ inputs.stage }} ${{ inputs.target }}
    runs-on: ${{ fromJSON(inputs.target == 'poc' && '["self-hosted", "macOS", "ARM64", "chalmers-macmini-node-1"]' || format('["self-hosted", "nemoclaw", "{0}"]', inputs.target)) }}
    environment: ${{ inputs.target }}
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run stage
        uses: ./.github/actions/run-stage
        with:
          target: ${{ inputs.target }}
          action: ${{ inputs.stage }}
