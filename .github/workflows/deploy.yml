name: Deploy NemoClaw

# Same path as main's workflow so the Actions button exists.
# Pick one stage. Do not run Ollama, NemoClaw, and sandbox in the same job.
on:
  workflow_dispatch:
    inputs:
      target:
        description: Machine (personal_config directory name)
        required: true
        type: choice
        options:
          - poc
          - chalmers
          - cliff
      stage:
        description: ollama, NemoClaw host tools, or sandbox first install
        required: true
        type: choice
        options:
          - ollama
          - nemoclaw
          - sandbox

concurrency:
  group: nemoclaw-${{ inputs.target }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: ${{ inputs.stage }} ${{ inputs.target }}
    runs-on: ${{ fromJSON(inputs.target == 'poc' && '["self-hosted", "macOS", "ARM64", "chalmers-macmini-node-1"]' || format('["self-hosted", "nemoclaw", "{0}"]', inputs.target)) }}
    environment: ${{ inputs.target }}
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run stage
        uses: ./.github/actions/run-stage
        with:
          target: ${{ inputs.target }}
          action: ${{ inputs.stage }}
