name: Redeploy

# Daily path: sync /opt/app, update host tools only when those files changed,
# patch sandbox config, then health-check Ollama / Gateway / Sandbox.
# Never onboard, --resume, or create a sandbox.
on:
  push:
    branches:
      - main
      - 'feature**'
  workflow_dispatch:
    inputs:
      target:
        description: Machine to deploy (personal_config directory name)
        required: true
        type: choice
        options:
          - poc
          - chalmers
          - cliff

concurrency:
  # Push events have no inputs; those deploys go to poc.
  group: nemoclaw-${{ inputs.target || 'poc' }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  redeploy:
    name: Redeploy ${{ inputs.target || 'poc' }}
    # Push to main or feature* plans stages from git diff. A manual run still picks the target.
    # poc runs on the Mac mini runner. Other targets stay on nemoclaw,<user>.
    runs-on: ${{ fromJSON((inputs.target || 'poc') == 'poc' && '["self-hosted", "macOS", "ARM64", "chalmers-macmini-node-1"]' || format('["self-hosted", "nemoclaw", "{0}"]', inputs.target || 'poc')) }}
    environment: ${{ inputs.target || 'poc' }}
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run stage
        uses: ./.github/actions/run-stage
        with:
          target: ${{ inputs.target || 'poc' }}
          action: auto
