name: Redeploy

on:
  push:
    branches:
      - main
      - 'feature**'
  workflow_dispatch:
    inputs:
      target:
        description: Machine to upgrade (personal_config directory name)
        required: true
        type: choice
        options:
          - poc
          - chalmers
          - cliff

concurrency:
  # Push events have no inputs; those deploys go to poc.
  group: nemoclaw-${{ inputs.target || 'poc' }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  redeploy:
    name: Redeploy ${{ inputs.target || 'poc' }}
    # Push to main or feature* upgrades poc. A manual run still picks the target.
    # poc runs on the Mac mini runner. Other targets stay on nemoclaw,<user>.
    runs-on: ${{ fromJSON((inputs.target || 'poc') == 'poc' && '["self-hosted", "macOS", "ARM64", "chalmers-macmini-node-1"]' || format('["self-hosted", "nemoclaw", "{0}"]', inputs.target || 'poc')) }}
    environment: ${{ inputs.target || 'poc' }}
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Clone to /opt/app
        run: bash ./scripts/sync-install.sh

      - name: Redeploy
        run: bash /opt/app/NemoClaw/scripts/deploy.sh "$TARGET" upgrade
        env:
          TARGET: ${{ inputs.target || 'poc' }}
