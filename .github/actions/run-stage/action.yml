name: Run deploy stage
description: Sync /opt/app/NemoClaw then run auto, ollama, nemoclaw, onboard, upgrade, or recover from that tree
inputs:
  target:
    required: true
  action:
    required: true
runs:
  using: composite
  steps:
    - name: Clone to /opt/app
      shell: bash
      run: bash "${GITHUB_WORKSPACE}/scripts/sync-install.sh"
    - name: Deploy ${{ inputs.action }}
      shell: bash
      run: |
        if [[ "$ACTION" == "auto" ]]; then
          bash /opt/app/NemoClaw/scripts/run-planned-deploy.sh "$TARGET"
        else
          bash /opt/app/NemoClaw/scripts/deploy.sh "$TARGET" "$ACTION"
        fi
      env:
        TARGET: ${{ inputs.target }}
        ACTION: ${{ inputs.action }}
